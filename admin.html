<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Painel · Rota Importados</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#001b50; --royal:#0055cc; --orange:#ff8900; --bg:#f5f8fc; --surface:#fff; --line:#e2e8f0; --text:#172338; --muted:#64748b; --ok:#00852e; --err:#dc2626; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .box { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 16px 40px -12px rgba(16,37,77,.18); }
    h1 { font: 700 1.5rem Poppins, sans-serif; margin-bottom: 6px; color: var(--navy); }
    p { color: var(--muted); font-size: .92rem; line-height: 1.5; }
    label { display: block; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
    input[type=password] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit; outline: 0; transition: border-color .18s, box-shadow .18s; }
    input[type=password]:focus { border-color: var(--royal); box-shadow: 0 0 0 3px rgba(0,85,204,.22); }
    .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 26px; text-align: center; cursor: pointer; transition: border-color .18s, background .18s; }
    .drop:hover, .drop.over { border-color: var(--royal); background: #eef4ff; }
    .drop input { display: none; }
    .files { margin-top: 10px; font-size: .88rem; display: grid; gap: 6px; }
    .files div { display: flex; justify-content: space-between; gap: 8px; }
    button { margin-top: 20px; width: 100%; height: 50px; border: 0; border-radius: 12px; font: 600 1rem Inter, sans-serif; cursor: pointer; background: var(--orange); color: #fff; transition: background .18s; }
    button:hover:not(:disabled) { background: #e67a00; }
    button:disabled { opacity: .5; cursor: wait; }
    .log { margin-top: 16px; font-size: .9rem; display: grid; gap: 6px; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    a { color: var(--royal); }
  </style>
</head>
<body>
  <main class="box">
    <h1>Atualizar produtos</h1>
    <p>No <b>Catálogo Pro</b>, use <b>Configurações → Site da loja → Exportar para o site</b> e envie aqui o(s) arquivo(s) <code>loja-AAAA-MM-DD.zip</code>. Se vier em partes, selecione todas.</p>

    <label for="senha">Senha do painel</label>
    <input id="senha" type="password" autocomplete="current-password" />

    <label>Arquivos</label>
    <div class="drop" id="drop">
      <input id="file" type="file" accept=".zip" multiple />
      📦 Clique ou arraste o ZIP aqui
    </div>
    <div class="files" id="files"></div>

    <button id="send" disabled>Enviar para o site</button>
    <div class="log" id="log"></div>
    <p style="margin-top:18px"><a href="/">← Ver o site</a></p>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    let files = [];
    try { $("#senha").value = sessionStorage.getItem("rota_senha") || ""; } catch {}

    function setFiles(list) {
      files = [...list].filter((f) => /\.zip$/i.test(f.name)).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      $("#files").innerHTML = files.map((f) => `<div><span>${f.name.replace(/[<>&]/g, "")}</span><span>${(f.size / 1048576).toFixed(1)} MB</span></div>`).join("");
      $("#send").disabled = !files.length;
    }
    $("#drop").onclick = () => $("#file").click();
    $("#file").onchange = (e) => setFiles(e.target.files);
    $("#drop").ondragover = (e) => { e.preventDefault(); $("#drop").classList.add("over"); };
    $("#drop").ondragleave = () => $("#drop").classList.remove("over");
    $("#drop").ondrop = (e) => { e.preventDefault(); $("#drop").classList.remove("over"); setFiles(e.dataTransfer.files); };

    const log = (t, cls) => { const d = document.createElement("div"); d.className = cls || ""; d.textContent = t; $("#log").appendChild(d); };

    $("#send").onclick = async () => {
      const senha = $("#senha").value;
      if (!senha) return $("#senha").focus();
      try { sessionStorage.setItem("rota_senha", senha); } catch {}
      $("#send").disabled = true;
      $("#log").innerHTML = "";
      let last = null;
      for (const f of files) {
        log(`Enviando ${f.name}…`);
        try {
          const r = await fetch("/admin/importar", { method: "POST", headers: { "x-senha": senha, "Content-Type": "application/zip" }, body: f });
          const j = await r.json().catch(() => ({ erro: "Resposta inválida do servidor." }));
          if (!r.ok) { log(`✕ ${f.name}: ${j.erro}`, "err"); if (r.status === 401) break; continue; }
          last = j;
          log(`✓ ${f.name}: ${j.produtos != null ? j.produtos + " produtos, " : ""}${j.fotos} fotos`, "ok");
        } catch (e) {
          log(`✕ ${f.name}: falha de conexão`, "err");
        }
      }
      if (last && last.fotosFaltando) log(`Atenção: ${last.fotosFaltando} foto(s) ainda não estão no site. Exporte com "todas as fotos".`, "err");
      else if (last) log("Pronto! O site já mostra os produtos atualizados.", "ok");
      $("#send").disabled = false;
    };
  </script>
</body>
</html>
